services:
  - type: web
    name: ikkonadmin-web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    preDeployCommand: ./efbundle --connection "$ConnectionStrings__DefaultConnection"
    healthCheckPath: /health/ready
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: GoogleAgenda__ApplicationName
        value: IkkonAdmin
      - key: GoogleAgenda__CalendarId
        value: primary
      - key: GoogleAgenda__CredentialsPath
        value: ""
      - key: GoogleAgenda__OAuthClientSecretsPath
        sync: false
      - key: GoogleAgenda__RedirectUri
        sync: false
      - key: GoogleAgenda__TimeZone
        value: America/Sao_Paulo
      - key: PrivateFileStorage__Provider
        value: S3
      - key: PrivateFileStorage__BucketName
        sync: false
      - key: PrivateFileStorage__Region
        sync: false
      - key: PrivateFileStorage__ServiceUrl
        sync: false
      - key: PrivateFileStorage__ForcePathStyle
        value: "false"
      - key: PrivateFileStorage__AccessKeyId
        sync: false
      - key: PrivateFileStorage__SecretAccessKey
        sync: false
      - key: DataProtection__KeysPath
        value: /var/ikkon/dataprotection
      - key: DataProtection__CertificatePath
        sync: false
      - key: DataProtection__CertificatePassword
        sync: false
      - key: InitialAdminBootstrap__Login
        sync: false
      - key: InitialAdminBootstrap__Email
        sync: false
      - key: InitialAdminBootstrap__DisplayName
        sync: false
      - key: InitialAdminBootstrap__Password
        sync: false
    disk:
      name: ikkonadmin-persistent-data
      mountPath: /var/ikkon
      sizeGB: 1
