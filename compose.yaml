name: ikkonadmin

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${IKKONADMIN_SQL_PASSWORD:-IkkonLocal!2026}
    ports:
      - "${IKKONADMIN_SQL_PORT:-14333}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/1433'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ikkonadmin-web:local
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=${IKKONADMIN_DB_NAME:-IkkonAdminDb};User Id=sa;Password=${IKKONADMIN_SQL_PASSWORD:-IkkonLocal!2026};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True
      GoogleAgenda__ApplicationName: IkkonAdmin
      GoogleAgenda__CalendarId: primary
      GoogleAgenda__CredentialsPath: ""
      GoogleAgenda__OAuthClientSecretsPath: ""
      GoogleAgenda__RedirectUri: http://localhost:${IKKONADMIN_HTTP_PORT:-8080}/admin/agenda/google/callback
      GoogleAgenda__TimeZone: America/Sao_Paulo
    ports:
      - "${IKKONADMIN_HTTP_PORT:-8080}:8080"
    volumes:
      - app-uploads:/app/wwwroot/uploads
      - app-dataprotection:/root/.aspnet/DataProtection-Keys
    restart: unless-stopped

volumes:
  sqlserver-data:
  app-uploads:
  app-dataprotection:
