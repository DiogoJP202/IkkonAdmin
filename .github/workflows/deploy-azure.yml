name: Deploy IkkonAdmin to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ikkonadmin-azure-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DOTNET_VERSION: '10.0.x'
      PROJECT_PATH: IkkonAdmin.Web/IkkonAdmin.Web.csproj
      PUBLISH_DIR: ./publish
      AZURE_WEBAPP_NAME: ikkon-admin-demo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore IkkonAdmin.slnx

      - name: Build
        run: dotnet build IkkonAdmin.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test IkkonAdmin.Tests/IkkonAdmin.Tests.csproj --configuration Release --no-build

      - name: Restore local tools
        run: dotnet tool restore

      - name: Apply production migrations
        env:
          PRODUCTION_DB_CONNECTION_STRING: ${{ secrets.PRODUCTION_DB_CONNECTION_STRING }}
        run: >-
          dotnet ef database update
          --project ${{ env.PROJECT_PATH }}
          --startup-project ${{ env.PROJECT_PATH }}
          --connection "$PRODUCTION_DB_CONNECTION_STRING"
          --configuration Release
          --no-build

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ${{ env.PUBLISH_DIR }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIR }}
